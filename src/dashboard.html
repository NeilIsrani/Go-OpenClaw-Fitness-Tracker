<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Telemetry Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
        h1 { text-align: center; margin-bottom: 20px; color: #38bdf8; font-size: 1.8rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
        .card h2 { color: #94a3b8; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        .stat-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
        .stat-box { background: #1e293b; border-radius: 12px; padding: 16px 24px; border: 1px solid #334155; text-align: center; flex: 1; min-width: 140px; }
        .stat-box .label { color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
        .stat-box .value { font-size: 1.8rem; font-weight: 700; color: #38bdf8; margin-top: 4px; }
        .stat-box .value.warning { color: #fbbf24; }
        .stat-box .value.critical { color: #ef4444; }
        .upload-area { background: #1e293b; border: 2px dashed #475569; border-radius: 12px; padding: 40px; text-align: center; margin-bottom: 20px; cursor: pointer; transition: border-color 0.2s; }
        .upload-area:hover { border-color: #38bdf8; }
        .upload-area.dragover { border-color: #38bdf8; background: #1e3a5f; }
        .upload-area input[type="file"] { display: none; }
        .upload-area p { color: #94a3b8; margin-top: 8px; }
        .btn { background: #2563eb; color: white; border: none; padding: 10px 24px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
        .btn:hover { background: #1d4ed8; }
        .btn:disabled { background: #475569; cursor: not-allowed; }
        .anomaly-list { max-height: 300px; overflow-y: auto; }
        .anomaly-item { padding: 10px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .anomaly-item:last-child { border-bottom: none; }
        .badge { padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .badge.warning { background: #fbbf2433; color: #fbbf24; }
        .badge.critical { background: #ef444433; color: #ef4444; }
        .status { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
        .status.connected { background: #22c55e; }
        .status.disconnected { background: #ef4444; }
        #progress { display: none; margin-top: 12px; color: #38bdf8; }
        canvas { max-height: 250px; }
    </style>
</head>
<body>
    <h1>Fitness Telemetry Dashboard</h1>

    <div class="stat-row">
        <div class="stat-box"><div class="label">Total Records</div><div class="value" id="totalRecords">0</div></div>
        <div class="stat-box"><div class="label">Anomalies</div><div class="value warning" id="totalAnomalies">0</div></div>
        <div class="stat-box"><div class="label">SSE Clients</div><div class="value" id="sseClients">0</div></div>
        <div class="stat-box"><div class="label">Daily Strain</div><div class="value" id="strainScore">--</div></div>
        <div class="stat-box"><div class="label">Stream</div><div class="value"><span class="status disconnected" id="streamStatus"></span><span id="streamLabel">Disconnected</span></div></div>
    </div>

    <div class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" accept=".xml">
        <h2>Upload Apple Health Export</h2>
        <p>Drag & drop your export.xml here or click to browse</p>
        <button class="btn" id="uploadBtn" style="margin-top: 12px;" onclick="document.getElementById('fileInput').click()">Select File</button>
        <div id="progress"></div>
    </div>

    <div class="grid">
        <div class="card">
            <h2>Heart Rate (bpm)</h2>
            <canvas id="heartRateChart"></canvas>
        </div>
        <div class="card">
            <h2>Steps</h2>
            <canvas id="stepsChart"></canvas>
        </div>
        <div class="card">
            <h2>Calories Burned</h2>
            <canvas id="caloriesChart"></canvas>
        </div>
        <div class="card">
            <h2>Daily Strain - HR Zones</h2>
            <canvas id="strainChart"></canvas>
            <div id="strainDetails" style="margin-top: 12px; color: #94a3b8; font-size: 0.85rem;"></div>
        </div>
        <div class="card">
            <h2>Recent Anomalies</h2>
            <div class="anomaly-list" id="anomalyList">
                <p style="color: #64748b; text-align: center; padding: 20px;">No anomalies detected yet</p>
            </div>
        </div>
    </div>

    <script>
        const maxPoints = 200;

        function createChart(canvasId, label, borderColor, bgColor) {
            return new Chart(document.getElementById(canvasId), {
                type: 'line',
                data: { labels: [], datasets: [{ label, data: [], borderColor, backgroundColor: bgColor, borderWidth: 2, pointRadius: 0, tension: 0.3, fill: true }] },
                options: {
                    responsive: true,
                    animation: false,
                    scales: {
                        x: { display: true, ticks: { color: '#64748b', maxTicksLimit: 6 }, grid: { color: '#1e293b' } },
                        y: { ticks: { color: '#64748b' }, grid: { color: '#1e293b' } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        const hrChart = createChart('heartRateChart', 'Heart Rate', '#ef4444', '#ef444422');
        const stepsChart = createChart('stepsChart', 'Steps', '#22c55e', '#22c55e22');
        const calChart = createChart('caloriesChart', 'Calories', '#f59e0b', '#f59e0b22');

        const charts = { heart_rate: hrChart, steps: stepsChart, calories: calChart };

        function addDataPoint(chart, label, value) {
            chart.data.labels.push(label);
            chart.data.datasets[0].data.push(value);
            if (chart.data.labels.length > maxPoints) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
            }
            chart.update();
        }

        // SSE connection
        let eventSource;
        function connectSSE() {
            eventSource = new EventSource('/stream');
            eventSource.onopen = () => {
                document.getElementById('streamStatus').className = 'status connected';
                document.getElementById('streamLabel').textContent = 'Connected';
            };
            eventSource.onmessage = (e) => {
                try {
                    const event = JSON.parse(e.data);
                    if (event.event === 'metric') {
                        const r = event.data;
                        const chart = charts[r.type];
                        if (chart) {
                            const t = new Date(r.timestamp).toLocaleTimeString();
                            addDataPoint(chart, t, r.value);
                        }
                    } else if (event.event === 'anomaly') {
                        addAnomalyToList(event.data);
                    }
                } catch(err) {}
            };
            eventSource.onerror = () => {
                document.getElementById('streamStatus').className = 'status disconnected';
                document.getElementById('streamLabel').textContent = 'Reconnecting...';
            };
        }
        connectSSE();

        function addAnomalyToList(a) {
            const list = document.getElementById('anomalyList');
            if (list.querySelector('p')) list.innerHTML = '';
            const item = document.createElement('div');
            item.className = 'anomaly-item';
            const ts = new Date(a.timestamp).toLocaleString();
            item.innerHTML = `<div><strong>${a.type}</strong> ${a.value} (z=${a.zscore})<br><small>${ts}</small></div><span class="badge ${a.severity}">${a.severity}</span>`;
            list.prepend(item);
            const count = parseInt(document.getElementById('totalAnomalies').textContent) + 1;
            document.getElementById('totalAnomalies').textContent = count;
        }

        // File upload
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const progress = document.getElementById('progress');

        uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', () => { if (fileInput.files.length) uploadFile(fileInput.files[0]); });

        async function uploadFile(file) {
            progress.style.display = 'block';
            progress.textContent = `Uploading ${file.name} (${(file.size / 1024 / 1024).toFixed(1)} MB)...`;
            document.getElementById('uploadBtn').disabled = true;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const resp = await fetch('/ingest', { method: 'POST', body: formData });
                const data = await resp.json();
                progress.textContent = `Done! ${data.message}. ${data.anomalies} anomalies detected.`;
                refreshStats();
            } catch(err) {
                progress.textContent = `Error: ${err.message}`;
            }
            document.getElementById('uploadBtn').disabled = false;
        }

        // Strain chart (horizontal bar for HR zones)
        const strainChart = new Chart(document.getElementById('strainChart'), {
            type: 'bar',
            data: {
                labels: ['Zone 5 (Max)', 'Zone 4 (Hard)', 'Zone 3 (Vigorous)', 'Zone 2 (Moderate)', 'Zone 1 (Light)'],
                datasets: [{
                    data: [0, 0, 0, 0, 0],
                    backgroundColor: ['#ef4444', '#f97316', '#eab308', '#22c55e', '#38bdf8'],
                    borderWidth: 0
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                animation: false,
                scales: {
                    x: { title: { display: true, text: 'Minutes', color: '#64748b' }, ticks: { color: '#64748b' }, grid: { color: '#1e293b' } },
                    y: { ticks: { color: '#94a3b8' }, grid: { display: false } }
                },
                plugins: { legend: { display: false } }
            }
        });

        async function refreshStrain() {
            try {
                const today = new Date().toISOString().split('T')[0];
                const resp = await fetch(`/strain?date=${today}`);
                const data = await resp.json();
                document.getElementById('strainScore').textContent = data.score.toFixed(1);
                const scoreEl = document.getElementById('strainScore');
                if (data.score >= 15) scoreEl.className = 'value critical';
                else if (data.score >= 8) scoreEl.className = 'value warning';
                else scoreEl.className = 'value';
                strainChart.data.datasets[0].data = [data.zone5_minutes, data.zone4_minutes, data.zone3_minutes, data.zone2_minutes, data.zone1_minutes];
                strainChart.update();
                const details = document.getElementById('strainDetails');
                details.innerHTML = `Avg HR: ${data.avg_hr} bpm | Peak HR: ${data.max_hr} bpm | ${data.hr_samples} samples | ${data.workout_count} workout(s) | ${data.calories_burned} cal`;
            } catch(err) {}
        }

        // Load historical data into charts on page open
        async function loadHistorical() {
            try {
                const types = [
                    { key: 'heart_rate', chart: hrChart },
                    { key: 'steps',      chart: stepsChart },
                    { key: 'calories',   chart: calChart },
                ];
                for (const { key, chart } of types) {
                    const resp = await fetch(`/metrics?type=${key}&limit=200`);
                    const data = await resp.json();
                    if (!data.records) continue;
                    // sort ascending by timestamp
                    data.records.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
                    for (const r of data.records) {
                        const t = new Date(r.timestamp).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                        addDataPoint(chart, t, r.value);
                    }
                }
            } catch(err) {}

            // Load existing anomalies
            try {
                const resp = await fetch('/anomalies');
                const data = await resp.json();
                if (data.anomalies) {
                    data.anomalies.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
                    data.anomalies.forEach(a => addAnomalyToList(a));
                }
            } catch(err) {}

            // Load strain using the date of the most recent record
            try {
                const resp = await fetch('/metrics?type=heart_rate&limit=1');
                const data = await resp.json();
                if (data.records && data.records.length > 0) {
                    const latestDate = data.records[0].timestamp.split('T')[0];
                    const strainResp = await fetch(`/strain?date=${latestDate}`);
                    const strain = await strainResp.json();
                    document.getElementById('strainScore').textContent = strain.score.toFixed(1);
                    strainChart.data.datasets[0].data = [strain.zone5_minutes, strain.zone4_minutes, strain.zone3_minutes, strain.zone2_minutes, strain.zone1_minutes];
                    strainChart.update();
                    document.getElementById('strainDetails').innerHTML =
                        `Avg HR: ${strain.avg_hr} bpm | Peak HR: ${strain.max_hr} bpm | ${strain.hr_samples} samples | ${strain.workout_count} workout(s) | ${strain.calories_burned} cal`;
                }
            } catch(err) {}
        }

        // Periodic stats refresh
        async function refreshStats() {
            try {
                const resp = await fetch('/health');
                const data = await resp.json();
                document.getElementById('totalRecords').textContent = data.records.toLocaleString();
                document.getElementById('totalAnomalies').textContent = data.anomalies;
                document.getElementById('sseClients').textContent = data.sse_clients;
            } catch(err) {}
        }
        setInterval(refreshStats, 5000);
        setInterval(refreshStrain, 5000);
        loadHistorical();
        refreshStats();
    </script>
</body>
</html>
